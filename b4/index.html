<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đặt vé xem phim</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
}

.container {
    width: 450px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
}

h2 { text-align: center; }

input, select {
    width: 100%;
    padding: 8px;
    margin: 8px 0;
}

.inline-group {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.inline-group label {
    display: flex;
    align-items: center;
    gap: 5px;
}

.btn {
    width: 100%;
    padding: 10px;
    background: #ff6b6b;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 6px;
}

.tong {
    font-weight: bold;
    color: red;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">
<h2>Đặt vé xem phim</h2>

<form action="xuly.php" method="POST" onsubmit="return validateForm()">

Họ tên:
<input type="text" name="hoten" id="hoten">

SĐT:
<input type="text" name="sdt" id="sdt">

Phim:
<select name="phim">
<option>Avengers</option>
<option>Conan</option>
<option>Doraemon</option>
</select>

Suất chiếu:
<select name="suatchieu">
<option>9h</option>
<option>14h</option>
<option>19h</option>
</select>

Số vé:
<input type="number" name="sove" id="sove" oninput="tinhTien()">

Loại ghế:
<div class="inline-group">
<label><input type="radio" name="loaighe" value="50000" onclick="tinhTien()"> Thường (50k)</label>
<label><input type="radio" name="loaighe" value="100000" onclick="tinhTien()"> VIP (100k)</label>
</div>

Combo:
<div class="inline-group">
<label><input type="checkbox" name="combo[]" value="30000" onclick="tinhTien()"> Bắp + nước (30k)</label>
<label><input type="checkbox" name="combo[]" value="20000" onclick="tinhTien()"> Bắp lớn (20k)</label>
</div>

<div class="tong">Tổng tiền: <span id="tongtien">0</span> VND</div>

<button class="btn">Đặt vé</button>

</form>
</div>

<script>
function tinhTien() {
    let sove = document.getElementById("sove").value || 0;
    let ghe = document.querySelector('input[name="loaighe"]:checked');
    let gia = ghe ? parseInt(ghe.value) : 0;

    let combos = document.querySelectorAll('input[name="combo[]"]:checked');
    let tongCombo = 0;

    combos.forEach(c => {
        tongCombo += parseInt(c.value);
    });

    let tong = sove * gia + tongCombo;

    document.getElementById("tongtien").innerText = tong;
}

function validateForm() {
    let hoten = document.getElementById("hoten").value;
    let sdt = document.getElementById("sdt").value;
    let sove = document.getElementById("sove").value;

    if (hoten === "" || sdt === "") {
        alert("Nhập đầy đủ thông tin!");
        return false;
    }

    if (sove <= 0) {
        alert("Số vé phải > 0");
        return false;
    }

    return true;
}
</script>

</body>
</html>
